name: Chroma reference diagnostics

on:
  workflow_dispatch:
  push:
    branches: [feat/decoder-chroma]
    paths:
      - tools/chroma_reference.py
      - .github/workflows/chroma-diagnostics.yml

permissions:
  contents: read

jobs:
  original-chroma:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the pinned reference and dependencies
        run: |
          git submodule update --init --depth 1 upstream/libjxl
          git -C upstream/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - name: Install the Linux reference standard library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Build unchanged original graphs
        run: |
          cmake -S tools/oracle -B target/oracle -DCMAKE_BUILD_TYPE=Release -DORACLE_SANITIZERS=OFF
          cmake --build target/oracle --target jxl_oracle --parallel 2
          cmake -S tools/oracle -B target/oracle-asan -DCMAKE_BUILD_TYPE=Release -DORACLE_SANITIZERS=ON
          cmake --build target/oracle-asan --target jxl_oracle --parallel 2
      - name: Compare default source graphs and isolated candidates
        run: python3 tools/chroma_reference.py
      - name: Audit selected original stages against both untouched defaults
        run: python3 tools/chroma_reference.py --audit --output target/chroma-acceptance
      - name: Preserve exact original observations and compile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chroma-reference-${{ matrix.os }}
          path: |
            target/chroma-reference
            target/chroma-acceptance
            !target/chroma-reference/**/jxl_oracle
            !target/chroma-reference/**/*.o
            !target/chroma-acceptance/**/jxl_oracle
            !target/chroma-acceptance/**/*.o
          if-no-files-found: error
