name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  port:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 2
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the pinned reference and codec dependencies
        run: |
          git submodule update --init --depth 1 upstream/libjxl
          git -C upstream/libjxl submodule update --init --depth 1 third_party/highway third_party/brotli third_party/skcms
      - name: Install Rust toolchains
        run: rustup toolchain install stable 1.85 --profile minimal --component rustfmt --component clippy
      - name: Install the Linux reference standard library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev
      - name: Check the mechanical port
        run: python3 tools/check.py --sanitizers --msrv
      - name: Check the ordinary reference
        if: always()
        run: python3 tools/check.py --msrv
      - name: Record native Linux scalar diagnostics
        if: always() && runner.os == 'Linux'
        run: python3 tools/scalar_diagnostics.py
      - name: Audit the decoder numeric reference configurations
        if: always()
        run: |
          python3 tools/epf_reference.py
          python3 tools/noise_reference.py
          python3 tools/alpha_reference.py
          python3 tools/decoder_api_reference.py --output target/decoder-api-acceptance
          python3 tools/skcms_reference.py --output target/skcms-acceptance
          python3 tools/skcms_fitting_reference.py --output target/skcms-fitting-acceptance
          python3 tools/skcms_transform_reference.py --output target/skcms-transform-acceptance
          python3 tools/default_cms_reference.py --output target/default-cms-acceptance
      - name: Audit complete chroma images and retained frame lifecycles
        if: always()
        run: |
          python3 tools/chroma_reference.py --audit --output target/chroma-acceptance
          python3 tools/chroma_image_reference.py --output target/chroma-image-acceptance
          python3 tools/frame_sequences.py --output target/lifecycle-acceptance
          python3 tools/output_stage_reference.py --output target/output-stage-acceptance
      - name: Retain complete decoder source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-source-${{ matrix.os }}
          path: |
            target/chroma-acceptance
            !target/chroma-acceptance/**/jxl_oracle
            !target/chroma-acceptance/**/*.o
            target/chroma-image-acceptance
            target/lifecycle-acceptance
            target/output-stage-acceptance
            target/decoder-api-acceptance
            target/skcms-acceptance
            target/skcms-fitting-acceptance
            target/skcms-transform-acceptance
            target/default-cms-acceptance
          if-no-files-found: error
      - name: Audit complete extra-channel source bindings and stride boundaries
        if: always()
        run: python3 tools/extra_channels_reference.py --output target/extra-channels-reference
      - name: Retain complete extra-channel source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extra-channels-reference-${{ runner.os }}
          path: target/extra-channels-reference
          if-no-files-found: error
          retention-days: 7
      - name: Audit complete geometry source bindings and independent output captures
        if: always()
        run: python3 tools/decoder_geometry_reference.py --output target/decoder-geometry-reference
      - name: Retain complete geometry source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-geometry-reference-${{ runner.os }}
          path: target/decoder-geometry-reference
          if-no-files-found: error
      - name: Record native alpha configuration diagnostics
        if: always() && runner.os == 'Linux'
        run: python3 tools/alpha_diagnostics.py
      - name: Census every original patch-tree boundary
        if: always() && runner.os == 'Linux'
        run: python3 tools/patches_boundaries.py
      - name: Retain native alpha diagnostic evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alpha-diagnostics-${{ runner.os }}
          path: |
            target/alpha-diagnostics.json
            target/patches-boundaries.json
          if-no-files-found: error
          retention-days: 7
      - name: Audit integrated ICC reader, parser, and JPEG metadata
        if: always()
        run: |
          python3 tools/icc_reader_reference.py --output target/icc-reader-acceptance
          python3 tools/skcms_parser_reference.py --output target/skcms-parser-acceptance
          python3 tools/jpeg_metadata_reference.py --output target/jpeg-metadata-acceptance
      - name: Retain integrated component source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrated-components-${{ runner.os }}
          path: |
            target/icc-reader-acceptance
            target/skcms-parser-acceptance
            target/jpeg-metadata-acceptance
          if-no-files-found: error

      - name: Audit complete Brotli streaming and API source boundaries
        if: always()
        run: |
          python3 tools/brotli_stream_reference.py --output target/brotli-stream-acceptance
          python3 tools/brotli_stream_api_reference.py --output target/brotli-stream-api-acceptance
      - name: Retain Brotli source acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brotli-source-${{ runner.os }}
          path: |
            target/brotli-support/**/report.json
            target/brotli-stream-acceptance
            target/brotli-stream-api-acceptance
            !target/brotli-*-acceptance/**/*.o
            !target/brotli-*-acceptance/**/*.a
          if-no-files-found: error
          retention-days: 7
